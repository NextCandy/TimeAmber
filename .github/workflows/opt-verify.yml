name: TimeAmber optimization verification

on:
  pull_request:
    paths:
      - "src/**"
      - "server/**"
      - "scripts/opt/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/opt-verify.yml"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "server/**"
      - "scripts/opt/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/opt-verify.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "验证地址；默认使用生产站点"
        required: false
        default: "https://timeamber.com"
      bisect_start:
        description: "可选：bisect 起点 commit"
        required: false
        default: ""
      bisect_end:
        description: "可选：bisect 终点 commit"
        required: false
        default: ""
      bisect_metric:
        description: "可选：bisect 指标，例如 LCP"
        required: false
        default: "LCP"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      OPT_BASE_URL: ${{ inputs.base_url || vars.OPT_BASE_URL || 'https://timeamber.com' }}
      OPT_ARTICLE_PATH: ${{ vars.OPT_ARTICLE_PATH || '' }}
      OPT_ADMIN_STORAGE_STATE: ${{ secrets.OPT_ADMIN_STORAGE_STATE || '' }}
      OPT_CHROME_PATH: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start local production server when no explicit URL is supplied
        if: ${{ startsWith(env.OPT_BASE_URL, 'http://127.0.0.1') && github.event_name != 'schedule' }}
        shell: bash
        run: |
          nohup env PORT=4173 npm run start > "$RUNNER_TEMP/timeamber-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$OPT_BASE_URL/" > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/timeamber-preview.log"
          exit 1

      - name: Verify public pages, SEO contracts, resources, and budget
        run: |
          npm run opt:verify -- --label "ci-${GITHUB_RUN_ID}" --base-url "$OPT_BASE_URL" --page "首页,文章页,归档页,分类页" --viewport mobile,desktop --scenario fast

      - name: Verify visual baseline
        run: |
          npm run opt:visual -- --label "ci-${GITHUB_RUN_ID}" --base-url "$OPT_BASE_URL" --page "首页,文章页,归档页,分类页" --viewport mobile-390,desktop-1440 --scenario fast

      - name: Generate failure attribution
        if: ${{ always() }}
        shell: bash
        run: |
          latest=$(find reports/opt -maxdepth 2 -name raw.json -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          if [[ -n "$latest" ]]; then node scripts/opt/failure-annotate.mjs --input "$latest" || true; fi

      - name: Generate offline trend artifacts
        if: ${{ always() }}
        run: npm run opt:trend

      - name: Upload optimization artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: timeamber-opt-${{ github.run_id }}
          path: |
            reports/opt/**
            ${{ runner.temp }}/timeamber-server.log
          if-no-files-found: warn
          retention-days: 20

      - name: Comment PR with verification summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          RUN_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- timeamber-opt-verify -->';
            const body = `${marker}\n## TimeAmber 优化验证\n\n- 工作流状态：**${process.env.RUN_STATUS}**\n- 原始报告与趋势产物：见本次 workflow artifact。\n- 失败归因层级：契约/可用性、浏览器/运行时、资源/SEO、预算/回归。`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Automated bisect in isolated worktree
        if: ${{ inputs.bisect_start != '' && inputs.bisect_end != '' }}
        env:
          OPT_BISECT_TEST_COMMAND: npm run opt:verify -- --label bisect --base-url "$OPT_BASE_URL" --page 首页 --viewport mobile --scenario fast
        run: npm run opt:bisect -- --start "${{ inputs.bisect_start }}" --end "${{ inputs.bisect_end }}" --metric "${{ inputs.bisect_metric }}"
